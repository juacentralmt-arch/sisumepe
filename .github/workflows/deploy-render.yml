name: deploy-render

# Gatilho redundante de deploy: todo push na main chama o Deploy Hook do
# Render, mesmo se a integração GitHub↔Render (Auto-Deploy) falhar um push.
# Requer o secret RENDER_DEPLOY_HOOK (URL do hook em Render → sisumepe →
# Settings → Deploy Hook). Sem o secret, o workflow pula em silêncio.
# O deploy em si continua idêntico ao Manual Deploy (mesmo build/start).

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" manual no Actions

jobs:
  trigger:
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar Deploy Hook do Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Disparando deploy..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -X POST "$HOOK" || echo "000")
          echo "HTTP $CODE"
          # 200/201/204 = hook aceito (build entra na fila do Render)
          case "$CODE" in
            200|201|202|204) echo "Deploy enfileirado com sucesso";;
            *) echo "::error::Hook retornou $CODE — confira a URL em Secrets"; exit 1;;
          esac
