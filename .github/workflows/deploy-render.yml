name: deploy-render

# Deploy somente depois de um CI verde na main. O gatilho antigo (push direto)
# permitia publicar mesmo com testes quebrados ou com o frontend inválido.
# Requer o secret RENDER_DEPLOY_HOOK (URL do hook em Render -> sisumepe ->
# Settings -> Deploy Hook). Sem o secret, o workflow apenas informa e encerra.
# Importante: desative o Auto-Deploy do Render para que este gate seja efetivo.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: # "Run workflow" manual no Actions

jobs:
  trigger:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar Deploy Hook do Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK nao configurado. Use Manual Deploy no Render ou cadastre o secret."
            exit 0
          fi
          echo "Disparando deploy..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -X POST "$HOOK" || echo "000")
          echo "HTTP $CODE"
          # 200/201/202/204 = hook aceito (build entra na fila do Render)
          case "$CODE" in
            200|201|202|204) echo "Deploy enfileirado com sucesso";;
            *) echo "::error::Hook retornou $CODE — confira a URL em Secrets"; exit 1;;
          esac
