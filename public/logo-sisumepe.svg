<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#g)"/>
  <!-- Escudo -->
  <path d="M50 14 L78 26 V54 C78 68 66 82 50 90 C34 82 22 68 22 54 V26 Z" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" opacity="0.95"/>
  <!-- Tornozeleira + sinal -->
  <g transform="translate(50,52)">
    <!-- pulseira -->
    <rect x="-18" y="-6" width="36" height="14" rx="7" fill="none" stroke="white" stroke-width="2.2"/>
    <rect x="-18" y="-3" width="36" height="8" rx="4" fill="white" opacity="0.12"/>
    <!-- fecho -->
    <rect x="-4" y="-8" width="8" height="18" rx="2.5" fill="white"/>
    <rect x="-2" y="-5" width="4" height="12" rx="1.5" fill="#0b1220" opacity="0.9"/>
    <!-- ondas de sinal -->
    <path d="M14 -10 A18 18 0 0 1 14 10" fill="none" stroke="url(#s)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <path d="M20 -14 A26 26 0 0 1 20 14" fill="none" stroke="url(#s)" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
    <path d="M26 -18 A34 34 0 0 1 26 18" fill="none" stroke="url(#s)" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
    <!-- ponto central -->
    <circle cx="0" cy="1" r="2" fill="#22d3ee"/>
  </g>
  <!-- balança sutil no topo do escudo -->
  <g transform="translate(50,28)" opacity="0.85">
    <line x1="0" y1="2" x2="0" y2="8" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-8" y1="2" x2="8" y2="2" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-8 2 L-11 6 L-5 6 Z" fill="none" stroke="white" stroke-width="1"/>
    <path d="M8 2 L5 6 L11 6 Z" fill="none" stroke="white" stroke-width="1"/>
  </g>
</svg>
