services:
  - type: web
    name: sisumepe
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: apt-get update -qq && apt-get install -y -qq tesseract-ocr tesseract-ocr-por || true; npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FORCE_HTTPS
        value: 1
      - key: NODE_ENV
        value: production
      - key: FILES_TTL_HOURS
        value: 24
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: CALENDLY_TOKEN
        sync: false
      - key: CALENDLY_URL
        sync: false
